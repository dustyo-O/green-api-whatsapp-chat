name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Never install git hooks on runners.
  HUSKY: 0

permissions:
  contents: read

# Review F4 (spec 001, tech §2.7): this MUST stay at workflow level, covering check + deploy.
# All `main` runs share one group and run one at a time; job-level concurrency on `deploy` alone
# would let a slow older `check` deploy after a newer one.
# Code review F1: `queue: max` keeps every pending run (FIFO, up to 100) instead of the default
# single slot, where a new run cancels the pending one. Without it, a re-run of an older `main` run
# would cancel the pending run of the newest commit, and the tip guard would then stop every other
# run from publishing, so the newest commit would never reach the page.
# GitHub rejects `queue: max` together with `cancel-in-progress: true`, so no run in this group is
# ever cancelled, PR runs included: a superseded PR run finishes before the next one starts.
concurrency:
  group: ci-${{ github.ref }}
  queue: max

jobs:
  # Spec 001 tech §2.6: lint every commit in the PR's range. Pushes to `main` are not linted:
  # their commits were linted in the PR, and commitlint.config.js ignores only merge messages.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # SHAs go through env, never interpolated into the script.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run commitlint -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same gate the lanes run (harness.json), so CI and local agree by construction.
      - run: npm run check
      # Exactly the bytes that passed the gate get published; deploy never rebuilds.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Review 2 F1 (spec 001, tech §2.7): concurrency doesn't cover a manual re-run of an older
      # `main` run. Only the commit that is the tip of `main` right now may publish; any other run
      # was superseded by a newer one, which owns publishing, so it skips and stays green.
      - name: Tip guard
        id: tip
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          tip=$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::Could not read the tip of main from $REPO_URL"
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA superseded by $tip; not publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tip.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
